services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmosai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AWS_DEFAULT_REGION=ap-south-2
      - USE_DYNAMODB=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
